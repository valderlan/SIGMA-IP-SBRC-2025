[project]
name = "sigma-ip-ai-model"
version = "0.1.0"
description = "AI model for IP classification"
authors = [
    { name = "valderlan", email = "valderlann@hotmail.com" }
]
dependencies = [
    "scikit-learn>=1.6.1",
    "pandas>=2.2.3",
    "tensorflow>=2.19.0",
    "matplotlib>=3.10.1",
    "seaborn>=0.13.2",
    "imblearn>=0.0",
    "scikeras>=0.13.0",
    "tabulate>=0.9.0",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/"]
